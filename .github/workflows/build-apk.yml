name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - english-translation
      - arena/1f8cdf47-magic-ling-pixel-dungeon
    paths:
      - '.github/workflows/build-apk.yml'
      - 'core/src/main/assets/messages/**'

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to the Android application tree
        run: |
          git fetch origin Android
          git checkout -B apk-build origin/Android
          echo "Building $(git rev-parse --short HEAD) of branch Android"

      - name: Insert the English text
        run: |
          git checkout "$GITHUB_SHA" -- core/src/main/assets/messages
          python3 - <<'PY'
          import glob, os, re, shutil
          base = 'core/src/main/assets/messages'
          packs = [p for p in glob.glob(base + '/*/*.properties')
                   if not re.search(r'_[a-z]{2,4}\.properties$', p)]
          for p in packs:
              en = p[:-len('.properties')] + '_en.properties'
              shutil.copyfile(p, en)
          print('wrote English packs:', len(packs))
          PY

      - name: Provide the Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > core/google-services.json
            echo "Using the repository secret"
          else
            cat > core/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "magic-ling-english",
              "storage_bucket": "magic-ling-english.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.ansdomagiclingpixeldungeon.ling"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111",
                  "android_client_info": {
                    "package_name": "com.ansdomagiclingpixeldungeon.ling.indev"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "Using a placeholder so the Google services task has a file to read"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the debug APK
        run: |
          chmod +x gradlew
          if ./gradlew core:assembleDebug --no-daemon; then
            exit 0
          fi
          echo "Retrying with the upstream Gradle distribution"
          sed -i 's#https://mirrors.cloud.tencent.com/gradle/#https://services.gradle.org/distributions/#' \
            gradle/wrapper/gradle-wrapper.properties
          ./gradlew core:assembleDebug --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p out
          find core/build/outputs/apk -name '*.apk' -print -exec cp {} out/MagicLing-English-armv7.apk \;
          ls -l out

      - name: Check what actually went into the APK
        run: |
          python3 - <<'PY'
          import re, zipfile
          z = zipfile.ZipFile('out/MagicLing-English-armv7.apk')
          names = z.namelist()
          for abi in ('armeabi-v7a', 'arm64-v8a'):
              assert f'lib/{abi}/libgdx.so' in names, f'missing {abi} natives'
              assert f'lib/{abi}/libgdx-freetype.so' in names, f'missing {abi} freetype'
          cjk = re.compile('[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uff01-\uff60\uffe0-\uffee]')
          for p in ('assets/messages/windows/windows.properties',
                    'assets/messages/windows/windows_en.properties',
                    'assets/messages/actors/actors.properties'):
              data = z.read(p).decode('utf-8')
              hits = cjk.findall(data)
              assert not hits, f'{p} still holds {len(hits)} Chinese characters, e.g. {hits[:6]}'
              assert 'windows.wndkeybindings' in data or 'actors.mobs' in data, p
          win = z.read('assets/messages/windows/windows.properties').decode('utf-8')
          assert 'windows.wndkeybindings.prev=<' in win, 'English arrow keys are not in the APK'
          print(f'APK holds {len(names)} entries, armv7 and arm64 natives present, message packs are English')
          PY

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicLing-English-armv7
          path: out/*.apk

      - name: Attach the APK to the english-apk release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view english-apk >/dev/null 2>&1 \
            || gh release create english-apk \
                 --target "$GITHUB_SHA" \
                 --title "English build" \
                 --notes "Debug build of the Android branch with the English text. Works on armeabi-v7a and arm64 devices running Android 5.0 or newer."
          gh release upload english-apk out/MagicLing-English-armv7.apk --clobber
